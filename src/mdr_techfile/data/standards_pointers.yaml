# standards_pointers.yaml
#
# Pointer table: MDR Annex II section -> ISO/IEC standard clause citations.
#
# IMPORTANT: This file contains ONLY citation metadata (standard ID + clause numbers).
# No verbatim text from copyrighted ISO/IEC standards is reproduced here.
# All pointer entries are limited to: standard identifier, year, clause number, topic label.
#
# Source for MDR references: Regulation (EU) 2017/745 (OJ L 117, 5.5.2017), public domain.
# ISO/IEC standard identifiers are in the public domain as bibliographic references.

- section: "Annex II §1.1"
  title: "Device description and specification"
  pointers:
    - standard_id: "ISO 14971:2019"
      clause: "§3.1"
      topic: "Intended use definition"
      applicability: "always"
      note: "Defines 'intended use' as a cornerstone of the risk management process."
    - standard_id: "IEC 62304:2006+A1:2015"
      clause: "§4.3"
      topic: "Software safety class assignment"
      applicability: "if_software"
      note: "Safety class (A/B/C) must be documented based on severity of hazardous situations."
    - standard_id: "IEC 62366-1:2015+A1:2020"
      clause: "§5.1"
      topic: "Intended use and user population"
      applicability: "always"
      note: "Usability engineering requires intended user, use environment, and use context specification."
    - standard_id: "MDCG 2021-24"
      clause: "§4"
      topic: "Guidance on classification of MDR devices"
      applicability: "always"
      note: "MDCG guidance document on classification rules (non-binding, public)."

- section: "Annex II §1.2"
  title: "Reference to previous and similar generations"
  pointers:
    - standard_id: "ISO 14971:2019"
      clause: "§4.2"
      topic: "Risk management file continuity"
      applicability: "always"
      note: "Risk management file should reference known risks from prior generations."
    - standard_id: "MDCG 2020-6"
      clause: "§4"
      topic: "Clinical evaluation of similar devices"
      applicability: "always"
      note: "MDCG guidance on clinical evaluation (public document)."

- section: "Annex II §2"
  title: "Information to be supplied by the manufacturer (labelling, IFU, UDI)"
  pointers:
    - standard_id: "ISO 15223-1:2021"
      clause: "§5"
      topic: "Symbols for medical devices"
      applicability: "always"
      note: "Normative symbols for labels and accompanying documents."
    - standard_id: "IEC 62366-1:2015+A1:2020"
      clause: "§5.9"
      topic: "Instructions for Use (IFU) content"
      applicability: "always"
      note: "Usability specification includes IFU content and format requirements."
    - standard_id: "EUDAMED UDI guidance"
      clause: "§3"
      topic: "UDI-DI and UDI-PI assignment"
      applicability: "always"
      note: "UDI assignment rules; refer to EUDAMED actor registration guidance."

