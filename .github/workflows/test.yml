name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package + dev deps
        run: |
          python -m pip install -e ".[dev]"

      - name: Run unittests
        run: |
          python -m unittest discover -v tests

      - name: Smoke-test CLI
        run: |
          mdr-techfile --version
          mdr-techfile --help
          mdr-techfile manifest > /tmp/manifest.json
          python -c "import json; json.load(open('/tmp/manifest.json'))"
          mdr-techfile validate --spec tests/fixtures/sample_device.yaml
          mdr-techfile scaffold --spec tests/fixtures/sample_device.yaml --output /tmp/techfile
          test -d /tmp/techfile
          test "$(ls /tmp/techfile/*.md | wc -l)" -ge 13
          test -f /tmp/techfile/manifest.json
          python -c "import json; json.load(open('/tmp/techfile/manifest.json'))"
