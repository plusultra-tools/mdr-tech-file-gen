name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package + dev deps
        run: |
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Smoke-test CLI
        run: |
          mdr-techfile --version
          mdr-techfile --help
          mdr-techfile validate --spec examples/quickstart/device-spec.yaml
          mdr-techfile manifest --spec examples/quickstart/device-spec.yaml --out /tmp/manifest.json
          python -c "import json; json.load(open('/tmp/manifest.json'))"
          mdr-techfile scaffold --spec examples/quickstart/device-spec.yaml --out /tmp/techfile
          test -d /tmp/techfile
          test -f /tmp/techfile/annex-II.md
          test -f /tmp/techfile/annex-III.md
          test -f /tmp/techfile/checklist.md
          test -f /tmp/techfile/standards-matrix.md
          test -f /tmp/techfile/audit.sha256
